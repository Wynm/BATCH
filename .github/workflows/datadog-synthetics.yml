# This workflow triggers Datadog Synthetic tests within your Datadog organisation.
# For more information on running Synthetic tests within GitHub workflows, see:
# https://docs.datadoghq.com/synthetics/cicd_integrations/github_actions/

# This workflow uses a third-party action. Review its terms of service, privacy policy,
# and support documentation before use.

# Required repository secrets:
#   DD_API_KEY
#   DD_APP_KEY

name: Run Datadog Synthetic tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Datadog Synthetic tests
        uses: DataDog/synthetics-ci-github-action@87b505388a22005bb8013481e3f73a367b9a53eb # v1.4.0
        with:
          api_key: ${{ secrets.DD_API_KEY }}
          app_key: ${{ secrets.DD_APP_KEY }}
          test_search_query: 'tag:e2e-tests'
